<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isometric Contributions settings</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <img src="icon-48.png" width="32" height="32" alt="" />
      <div>
        <h1>Isometric Contributions</h1>
        <p>Chart settings</p>
      </div>
    </header>
    <main>
      <form>
        <fieldset disabled>
          <legend>Contribution color</legend>
          <div class="color-controls">
            <label for="contribution-color">Base color</label>
            <input
              id="contribution-color"
              type="color"
              value="#0969da"
              aria-describedby="color-help"
            />
            <output id="color-value" for="contribution-color">#0969da</output>
          </div>
          <div id="palette-preview" aria-hidden="true"></div>
          <p id="color-help">Shades adapt to light and dark themes. Counts stay unchanged.</p>
          <button id="reset-color" type="button">Reset to blue</button>
        </fieldset>
        <fieldset disabled>
          <legend>Height scale</legend>
          <div id="height-scales"></div>
        </fieldset>
      </form>
      <p id="save-status" role="status">Loading settings…</p>
    </main>
  </body>
</html>
