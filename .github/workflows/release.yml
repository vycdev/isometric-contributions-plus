name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type (ignored when store is set)'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      store:
        description: 'Which store to submit to'
        required: false
        default: all
        type: choice
        options:
          - all
          - chrome
          - firefox
          - edge

# No access by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  validate-publishing-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Check fork publisher configuration before release changes
        env:
          STORE: ${{ inputs.store }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_ADDON_SLUG: ${{ vars.FIREFOX_ADDON_SLUG }}
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: node scripts/submit.js "$STORE" --check-config

  prepare:
    needs: validate-publishing-config
    if: inputs.store == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Dependencies install and tests run below; don't leave the
          # write-access token in .git/config for them. Only the push uses it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          pnpm run version:${{ inputs.version_type }}
          VERSION=$(pnpm --silent run version:get)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git add src/manifest.json
          git add "safari/Isometric Contributions/Isometric Contributions Extension/Resources/manifest.json"
          git add "safari/Isometric Contributions/Isometric Contributions.xcodeproj/project.pbxproj"
          git commit -m "Bump version to ${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$REMOTE" HEAD
          git push "$REMOTE" "v${VERSION}"

  # safari:
  #   needs: prepare
  #   uses: ./.github/workflows/release-safari.yml
  #   with:
  #     ref: v${{ needs.prepare.outputs.version }}
  #   secrets: inherit

  release:
    needs: [validate-publishing-config, prepare]
    if: always() && needs.validate-publishing-config.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.version && format('v{0}', needs.prepare.outputs.version) || github.ref }}
          # Store credentials are in this job; keep the GitHub token out of
          # reach of the dependencies that run during install and build.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all browsers
        run: pnpm run build:all

      - name: Preflight every selected store before uploading
        env:
          STORE: ${{ inputs.store }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_ADDON_SLUG: ${{ vars.FIREFOX_ADDON_SLUG }}
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: pnpm run "submit:$STORE" --preflight

      - name: Submit to Chrome Web Store
        if: inputs.store == 'all' || inputs.store == 'chrome'
        env:
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: pnpm run submit:chrome

      - name: Submit to Firefox Add-ons
        if: inputs.store == 'all' || inputs.store == 'firefox'
        env:
          FIREFOX_ADDON_SLUG: ${{ vars.FIREFOX_ADDON_SLUG }}
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: pnpm run submit:firefox

      - name: Submit to Edge Add-ons
        if: inputs.store == 'all' || inputs.store == 'edge'
        continue-on-error: ${{ inputs.store == 'all' }}
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: pnpm run submit:edge

      - name: Create GitHub Release
        if: inputs.store == 'all'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/isometric-contributions-plus-chrome.zip
            artifacts/isometric-contributions-plus-edge.zip
            artifacts/isometric-contributions-plus-firefox.zip
