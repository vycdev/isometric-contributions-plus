version: 2
updates:
  # GitHub uses the npm ecosystem for pnpm, including pnpm-lock.yaml v9.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      parcel:
        patterns:
          - "@parcel/*"
          - "parcel"
  # Workflow actions are pinned to commit SHAs; Dependabot updates the pin
  # and its version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
