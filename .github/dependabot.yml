version: 2
updates:
  # GitHub uses the npm ecosystem for pnpm, including pnpm-lock.yaml v9.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      parcel:
        patterns:
          - "@parcel/*"
          - "parcel"
